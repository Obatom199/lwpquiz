<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Fastest Fingers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><h1 class="logo">Fastest Fingers</h1><div class="tag">Youth Fellowship Live Quiz</div></header>
<main id="app"></main>
<script type="module">
import {ready,sb,S,$,esc,sync,listen,board,players,setup,A} from './shared.js';
let pid = '', last = '';

async function join() {
  const c = $('#cd').value.trim(), n = $('#nm').value.trim().slice(0, 20) || 'Guest';
  const g = await sb.from('lq_games').select('code').eq('code', c).maybeSingle();
  if (!g.data) return $('#err').textContent = 'Game not found. Check the code on the big screen.';
  const taken = ((await sb.from('lq_players').select('name').eq('code', c)).data || []).map(p => p.name);
  let name = n, k = 2;
  while (taken.includes(name)) name = n + ' ' + k++;
  pid = Math.random().toString(36).slice(2, 10);
  const { error } = await sb.from('lq_players').insert({ id: pid, code: c, name });
  if (error) return $('#err').textContent = 'Could not join. Try again.';
  localStorage.qsess = JSON.stringify({ code: c, pid });
  await sync(); listen(c, draw);
}
function ans(i) {
  sb.from('lq_answers').insert({ code: S.code, pid, choice: i }).then(() => {});
  lock(i);
}
function lock(i) { document.querySelectorAll('button.o').forEach((b, j) => { b.disabled = true; if (j !== i) b.classList.add('dim'); }); }
$('#app').onclick = e => {
  const b = e.target.closest('[data-i]');
  if (b && !b.disabled) ans(+b.dataset.i);
  if (e.target.id === 'go') join();
};

function draw() {
  if (S.code && !S.loaded) return;
  const s = S.G.state || { phase: 'none' }, me = S.G.players && S.G.players[pid];
  const k = (me ? 'P' : 'J') + s.phase + s.qi;
  if (k !== last) { last = k; build(me, s); }
  upd(me, s);
}
function build(me, s) {
  const p = s.phase; let h = '';
  if (!me) h = `<div class="card pop"><h2>Join the game</h2><input id="cd" inputmode="numeric" maxlength="4" placeholder="Game code" value="${esc(S.code || new URLSearchParams(location.search).get('c') || '')}"><input id="nm" maxlength="20" placeholder="Your name" autocomplete="off"><button id="go">Join</button><p id="err" class="err"></p></div>`;
  else if (p === 'lobby') h = `<div class="card pop center"><h2>You are in, ${esc(me.name)}!</h2><p>Waiting for the host to start. Get your thumbs ready.</p></div><div class="card"><b>Players</b><div id="lb"></div></div>`;
  else if (p === 'question' || p === 'reveal') {
    const O = s.opts.map((t, i) => p === 'reveal'
      ? `<div class="o o${i} ${i === s.correct ? 'good' : 'dim'}"><b>${A[i]}</b>${esc(t)}</div>`
      : `<button class="o o${i}" data-i="${i}"><b>${A[i]}</b>${esc(t)}</button>`).join('');
    h = `<div class="head"><span>Question ${s.qi + 1} of ${s.total}</span><span id="cnt"></span></div><div class="bar"><i id="bar"></i></div><h1 class="pop">${esc(s.q)}</h1><div class="opts">${O}</div><div class="msg" id="msg"></div><div class="card"><b>Leaderboard</b><div id="lb"></div></div>`;
  } else if (p === 'done') h = '<div class="card pop center"><h2>Final results</h2><div class="msg" id="msg"></div></div><div class="card"><div id="lb"></div></div>';
  else h = '<div class="card center">The game is not running.</div>';
  $('#app').innerHTML = h;
}
function upd(me, s) {
  const set = (q, t) => { const e = $(q); if (e) e.textContent = t; };
  const lb = $('#lb'); if (lb) lb.innerHTML = board(5);
  const rank = players().findIndex(x => x.id === pid) + 1;
  if (s.phase === 'question' && me) {
    const mine = S.G.ans && S.G.ans[pid];
    if (mine) { set('#msg', 'Locked in. Wait for the timer.'); lock(mine.choice); }
  }
  if (s.phase === 'reveal' && me) set('#msg', (me.choice === -1 ? 'Too slow, no answer.' : me.pts > 0 ? 'Correct! +' + me.pts + ' points' : 'Not this time.') + '  Score ' + me.score + ', rank ' + rank);
  if (s.phase === 'done' && me) set('#msg', 'You finished #' + rank + ' with ' + me.score + ' points');
}
if (!ready) setup('Open shared.js and paste your Supabase URL and anon key.');
else {
  const saved = JSON.parse(localStorage.qsess || 'null');
  if (saved) { pid = saved.pid; sync().then(() => listen(saved.code, draw)); }
  draw();
}
</script></body></html>
